<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>FocusLab AR Fixed</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #ui-overlay {
            position: absolute; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.8); color: white; font-family: sans-serif;
        }
        button {
            padding: 20px 40px; font-size: 18px; border-radius: 50px; border: none; background: #e63946; color: white; cursor: pointer;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <button onclick="startApp()">ЗАПУСТИТЬ МАГИЮ</button>
    </div>

    <video id="arVideo" src="video-1.mp4" preload="auto" loop="true" crossorigin="anonymous" muted playsinline style="display:none;"></video>

    <a-scene mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: no; uiError: no; uiScanning: no;" 
             embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" id="targetEntity">
            <a-video id="arVideoScene" src="#arVideo" width="1" height="1.333" position="0 0 0" visible="false"></a-video>
        </a-entity>
    </a-scene>

    <script>
        const sceneEl = document.querySelector('a-scene');
        const video = document.getElementById('arVideo');
        const videoScene = document.getElementById('arVideoScene');
        const targetEntity = document.getElementById('targetEntity');
        const overlay = document.getElementById('ui-overlay');

        // 1. Запуск системы по кнопке
        function startApp() {
            video.play(); // Запускаем видео "в фоне" (оно скрыто)
            sceneEl.systems['mindar-image-system'].start(); // Запускаем камеру и AR
            overlay.classList.add('hidden');
        }

        // 2. Логика появления видео ТОЛЬКО на маркере
        targetEntity.addEventListener("targetFound", event => {
            video.muted = false; // Включаем звук
            videoScene.setAttribute('visible', true); // Делаем видео видимым в 3D
        });

        targetEntity.addEventListener("targetLost", event => {
            video.muted = true; // Выключаем звук, когда фото потеряно
            videoScene.setAttribute('visible', false); // Скрываем видео
        });
    </script>
</body>
</html>
