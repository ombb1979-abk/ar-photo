<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>FocusLab AR Final</title>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-webxr.prod.js"></script>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; background-color: black; }
      #ui-overlay {
        position: absolute; width: 100%; height: 100%; top: 0; left: 0;
        background: rgba(0,0,0,0.8); display: flex; flex-direction: column;
        justify-content: center; align-items: center; z-index: 10;
        color: white; font-family: sans-serif; text-align: center; cursor: pointer;
      }
      #ui-overlay.hidden { display: none; }
      #arVideo { display: none; } 
    </style>
  </head>
  
  <body>
    <div id="ui-overlay" onclick="startExperience()">
      <h1 style="margin-bottom: 10px;">FocusLab</h1>
      <p>Нажми здесь и наведи на фото</p>
    </div>

    <video id="arVideo" src="./video-1.mp4" preload="auto" crossorigin="anonymous" muted playsinline webkit-playsinline></video>
    
    <a-scene mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.001; filterBeta: 0.01;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets></a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" id="targetEntity">
        <a-video id="arVideoScene" src="#arVideo" width="1" height="1.333" position="0 0 0" rotation="0 0 0"></a-video>
      </a-entity>
    </a-scene>

    <script>
      const video = document.getElementById('arVideo');
      const videoScene = document.getElementById('arVideoScene');
      const overlay = document.getElementById('ui-overlay');

      function startExperience() {
        video.muted = false;
        video.play().then(() => {
          overlay.classList.add('hidden');
        }).catch((error) => {
          overlay.innerHTML = "<h1>Ошибка</h1><p>Нажми еще раз</p>";
        });
      }

      // Когда видео закончилось — скрываем его, чтобы показать бумажное фото
      video.onended = (event) => {
        videoScene.setAttribute('visible', false);
      };

      // Если отвели телефон и навели снова — возвращаем видимость
      document.getElementById('targetEntity').addEventListener("targetFound", event => {
        videoScene.setAttribute('visible', true);
        video.play();
      });

      window.onload = () => {
        video.play().catch(() => {});
      };
    </script>
  </body>
</html>
